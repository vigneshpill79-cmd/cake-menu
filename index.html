<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Cake Menu</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #1a0a00, #3b1a0a);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      color: #fff;
    }
    .header {
      text-align: center;
      margin-bottom: 10px;
    }
    .header h1 {
      font-size: 2rem;
      color: #f5c518;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(245,197,24,0.5);
    }
    .header p {
      font-size: 0.9rem;
      color: #c8a97e;
      margin-top: 4px;
      letter-spacing: 1px;
    }
    model-viewer {
      width: 340px;
      height: 340px;
      background: transparent;
      --poster-color: transparent;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(245,197,24,0.3);
      border-radius: 20px;
      padding: 20px 30px;
      text-align: center;
      backdrop-filter: blur(10px);
      margin-top: 5px;
      width: 320px;
    }
    .item-name {
      font-size: 1.4rem;
      color: #f5c518;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .item-desc {
      font-size: 0.85rem;
      color: #c8a97e;
      margin: 8px 0 14px 0;
      line-height: 1.5;
    }
    .price {
      font-size: 2rem;
      color: #fff;
      font-weight: bold;
    }
    .price span {
      font-size: 1rem;
      color: #c8a97e;
    }
    .badge {
      display: inline-block;
      background: #f5c518;
      color: #1a0a00;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 20px;
      margin-top: 10px;
      letter-spacing: 1px;
    }
    .footer {
      margin-top: 18px;
      font-size: 0.7rem;
      color: rgba(200,169,126,0.5);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>✦ DESSERT MENU ✦</h1>
    <p>Scan · View · Savour</p>
  </div>

  <model-viewer
    src="3DModel (8).glb"
    ar
    ar-modes="scene-viewer webxr quick-look"
    auto-rotate
    camera-controls
    shadow-intensity="1"
    exposure="1.2">
  </model-viewer>

  <div class="card">
    <div class="item-name">🍫 Chocolate Dream Cake</div>
    <div class="item-desc">Rich dark chocolate layers with creamy ganache frosting. A slice of pure indulgence.</div>
    <div class="price">₹99 <span>/ slice</span></div>
    <div class="badge">⭐ BESTSELLER</div>
  </div>

  <div class="footer">Rotate & zoom to explore · Powered by WebAR</div>
</body>
</html>
